<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualização de Estoque</title>
    <!-- Bootstrap CSS linkado via internet (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Estilo CSS local conforme especificado -->
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <!-- Navbar responsiva com Bootstrap -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Web Multitemática</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Contato</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="chat.html">Chat</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="stock.html">Estoque</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo principal -->
    <div class="container mt-5">
        <h1 class="text-center mb-4">Atualização de Estoque (WebSocket)</h1>
        <div class="row">
            <!-- Tabela de estoque com Bootstrap -->
            <div class="col-12">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Quantidade</th>
                            <th>Preço</th>
                        </tr>
                    </thead>
                    <tbody id="stockTable">
                        <!-- Dados de estoque serão inseridos aqui -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS linkado via internet (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- Socket.io linkado via internet (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/socket.io@4.7.5/client-dist/socket.io.min.js"></script>
    <script>
        // Conecta ao servidor WebSocket
        const socket = io();

        // Atualiza a tabela de estoque
        socket.on('stockUpdate', (stocks) => {
            const tableBody = document.getElementById('stockTable');
            tableBody.innerHTML = ''; // Limpa as linhas existentes
            stocks.forEach(stock => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${stock.product}</td>
                    <td>${stock.quantity}</td>
                    <td>R$ ${stock.price.toFixed(2)}</td>
                `;
                tableBody.appendChild(row);
            });
        });

        // Exibe status de conexão
        socket.on('connect', () => {
            const alert = document.createElement('div');
            alert.className = 'alert alert-success';
            alert.textContent = 'Conectado ao servidor de estoque!';
            document.querySelector('.container').prepend(alert);
            setTimeout(() => alert.remove(), 3000); // Remove após 3 segundos
        });
    </script>
</body>
</html>
