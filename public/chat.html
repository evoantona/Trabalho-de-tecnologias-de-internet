<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - WebSocket</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilo personalizado -->
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Projeto Web</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Contato (AJAX)</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="chat.html">Chat (WebSocket)</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Chat -->
  <div class="container mt-5">
    <h1>Chat em Tempo Real (WebSocket)</h1>
    <div class="chat-container" id="chatBox"></div>
    <form id="chatForm" class="row g-3">
      <div class="col-md-10">
        <input type="text" class="form-control" id="messageInput" placeholder="Digite sua mensagem..." required>
      </div>
      <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100">Enviar</button>
      </div>
    </form>
  </div>

  <!-- Socket.io e Bootstrap JS -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Conexão com WebSocket
    const socket = io();
    const chatBox = document.getElementById('chatBox');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');

    // Recebe mensagens do servidor
    socket.on('chatMessage', (msg) => {
      const messageElement = document.createElement('div');
      messageElement.classList.add('chat-message');
      messageElement.textContent = msg;
      chatBox.appendChild(messageElement);
      chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll
    });

    // Envia mensagens
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const message = messageInput.value.trim();
      if (message) {
        socket.emit('chatMessage', message);
        messageInput.value = '';
      }
    });
  </script>
</body>
</html>
